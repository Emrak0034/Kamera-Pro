name: APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Projeyi aç
        run: |
          python3 - <<'PY'
          import re, os
          t = open('proje.txt', encoding='utf-8').read()
          parts = re.split(r'^=== FILE: (.+?) ===\n', t, flags=re.M)
          for i in range(1, len(parts), 2):
              p = os.path.join('KameraPro', parts[i].strip())
              os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, 'w', encoding='utf-8').write(parts[i + 1])
          PY
      - run: gradle assembleDebug --no-daemon
        working-directory: KameraPro
      - uses: actions/upload-artifact@v4
        with:
          name: KameraPro-APK
          path: KameraPro/app/build/outputs/apk/debug/*.apk
